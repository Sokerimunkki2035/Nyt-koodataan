<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyt koodataan!</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #4CAF50;
        }
        p {
            font-size: 1rem;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        /* Valokuvan tyylit */
        .site-image {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .qr-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: inline-block;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .link-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
            word-break: break-all;
            max-width: 90%;
        }
    </style>
</head>
<body>

    <h1>Nyt koodataan!</h1>
    <p>Skannaa koodi puhelimellasi</p>

    <!-- Tikka-kuva upotettuna -->
    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA___<REDACTED_BASE64_DATA_FOR_BREVITY>..." alt="Tikka puussa" class="site-image">

    <div class="qr-card">
        <div id="qrcode"></div>
    </div>

    <div class="link-text" id="target-link"></div>

    <script>
        const targetUrl = "https://sokerimunkki2035.github.io/Nyt-koodataan/";

        document.getElementById("target-link").innerText = targetUrl;

        new QRCode(document.getElementById("qrcode"), {
            text: targetUrl,
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>

</body>
</html>
