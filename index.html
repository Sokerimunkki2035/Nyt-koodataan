<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyt koodataan!</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #4CAF50;
        }
        p {
            font-size: 1rem;
            color: #b0b0b0;
            margin-bottom: 15px;
        }
        .quote-box {
            background: #1e1e1e;
            border-left: 4px solid #4CAF50;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 8px;
            max-width: 340px;
            font-size: 0.95rem;
            font-style: italic;
            color: #e0e0e0;
            line-height: 1.4;
        }
        .game-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            max-width: 360px;
            width: 100%;
            box-sizing: border-box;
        }
        .level-title {
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .card {
            background: #2a2a2a;
            border: 2px solid #4CAF50;
            border-radius: 6px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card.flipped {
            background: #388E3C;
            transform: rotateY(180deg);
        }
        .card.matched {
            background: #1b5e20;
            border-color: #81c784;
            opacity: 0.6;
        }
        .reset-btn {
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }
        .reset-btn:active {
            background-color: #388E3C;
        }
        .site-image {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .qr-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: inline-block;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .link-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
            word-break: break-all;
            max-width: 90%;
        }
    </style>
</head>
<body>

    <h1>Nyt koodataan!</h1>
    <p>Skannaa koodi puhelimellasi</p>

    <div class="quote-box">
        "Syksy saapuu metsään, jossa mänty, koivu ja tammi siirtyvät vuorotellen uuteen, ihmeelliseen kierre-vaiheeseen."
    </div>

    <!-- Peli max 20 kortilla -->
    <div class="game-container">
        <h3>Luontomuistipeli</h3>
        <div class="level-title" id="level-display">Taso 1</div>
        <div class="game-grid" id="grid"></div>
        <p id="game-status" style="margin-top: 10px; font-weight: bold; color: #81c784; min-height: 24px;"></p>
        <button class="reset-btn" onclick="restartGame()">Aloita alusta 🔄</button>
    </div>

    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA_-9sAQwACAQEBAQECAQEBAgICAgIEAwICAgIFBAQDBQUDBAQGBQUFBQUGBQYGBQUGBgcHCAgHBwcJCQkJDAzODw0JCAgJCP/isEAIQACEQMREQH/xAAfAAABBQEBAQEBAQAAAAAAAAAAAQIDBAUGBwgICgv/xAC1EAACAQMDAgQDBQUEBAAAAX0BAgMABBEFEiExQQYTUWEHInEUMoGRoQgjQrHBFVLR8CQzYnKCCQoWFxgZGiUmJygpKjQzNzg4NWVFRHJKm5sdTVGR0jJSlhZVdXZ3Z4+QkRFRqbmJTVJKSVpqrN0hXY3TVVldnZ2h4gTmFh4iJSlhVJuarK6hpr6v4+Prr7vP09fX2+Pn6+OEJEQACAQMDAgQDBQUEBAAAAX0BAgMABBEFEiExQQYTUWEHInEUMoGRoQgjQrHBFVLR8CQzYnKCCQoWFxgZGiUmJygpKjQzNzg4NWVFRHJKm5sdTVGR0jJSlhVJuarK6hpr6v4+Prr7vP09fX2+Pn6+OEJEQD/2gAMAw00EAAhEDEQA/APxXf73uU3LqRz9lY19R07h8K5t5Q6bT9/rW7V4TnbJ0d53z5oT8vj/ACR6rD7s/A0PevDufXvvp228u0Vz2j028L7rR6X+x21/2e5/8Arb+u7n7D519d1Tzfvftf8d689r5Y/Zz3/f/AO5688u/3n/2Q==" alt="Tikka puussa" class="site-image">

    <div class="qr-card">
        <div id="qrcode"></div>
    </div>

    <div class="link-text" id="target-link"></div>

    <script>
        const targetUrl = "https://sokerimunkki2035.github.io/Nyt-koodataan/";
        document.getElementById("target-link").innerText = targetUrl;
        new QRCode(document.getElementById("qrcode"), {
            text: targetUrl,
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // 10 Luontoaiheista ikonia (10 paria = 20 korttia)
        const allIcons = ['🌲', '🍃', '🦅', '🍁', '🌰', '🍄', '🦊', '🦉', '🐻', '🐝'];

        let currentLevel = 1;
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 2;

        function startLevel(level) {
            currentLevel = level;
            document.getElementById('level-display').innerText = `Taso ${currentLevel} (${level * 4} korttia)`;
            document.getElementById('game-status').innerText = '';
            flippedCards = [];
            matchedPairs = 0;

            // Tasojen mukainen parimäärä: Taso 1 = 2, Taso 2 = 4, Taso 3 = 6, Taso 4 = 8, Taso 5 = 10 (20 korttia)
            totalPairs = level * 2;

            const selectedIcons = allIcons.slice(0, totalPairs);
            const cardDeck = [...selectedIcons, ...selectedIcons];
            cardDeck.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            cardDeck.forEach((item) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.value = item;
                card.innerText = '❓';

                card.addEventListener('click', () => {
                    if (flippedCards.length < 2 && !card.classList.contains('flipped') && !card.classList.contains('matched')) {
                        card.classList.add('flipped');
                        card.innerText = item;
                        flippedCards.push(card);

                        if (flippedCards.length === 2) {
                            setTimeout(checkMatch, 600);
                        }
                    }
                });

                grid.appendChild(card);
            });
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (c1.dataset.value === c2.dataset.value) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                matchedPairs++;

                if (matchedPairs === totalPairs) {
                    if (currentLevel < 5) {
                        document.getElementById('game-status').innerText = `Upeaa! Seuraava taso alkaa... 🚀`;
                        setTimeout(() => startLevel(currentLevel + 1), 1400);
                    } else {
                        document.getElementById('game-status').innerText = 'Mestarillista! Läpäisit kaikki 20 korttia! 🎉🏆';
                    }
                }
            } else {
                c1.classList.remove('flipped');
                c2.classList.remove('flipped');
                c1.innerText = '❓';
                c2.innerText = '❓';
            }
            flippedCards = [];
        }

        function restartGame() {
            startLevel(1);
        }

        startLevel(1);
    </script>

</body>
</html>
